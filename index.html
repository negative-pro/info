<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
// Apply the stored preference before the app paints to avoid a theme flash.
(() => {
  let preference = 'system'
  try {
    const stored = localStorage.getItem('negative-theme')
    if (['light', 'dark', 'system'].includes(stored)) preference = stored
  } catch { /* Storage can be unavailable in private or restricted contexts. */ }
  const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'
})()
    </script>
    <meta name="theme-color" content="#fafaf9" />
    <script type="module">
      import text from '/src/content/ar/texts.json'
      document.title = text.meta.title
      const description = document.createElement('meta')
      description.name = 'description'
      description.content = text.meta.description
      document.head.append(description)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
